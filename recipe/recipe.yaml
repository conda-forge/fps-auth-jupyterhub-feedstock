schema_version: 1

context:
  version: "0.10.2"

package:
  name: fps-auth-jupyterhub
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-auth-jupyterhub/fps_auth_jupyterhub-${{ version }}.tar.gz
    sha256: a296e8bb4b49297a4b89ec9fbd0d24f6675718a727255e4de45d07ed59ed52c0

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - aiosqlite <0.22.0
    - anyio
    - fastapi-core
    - fps
    - httpx2 >=2.9.1,<3.0.0
    - jupyterhub >=4.0.1,<5
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - pydantic
    - sqlalchemy

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - rich-click
        - pip
    script:
      - pip check
      - python -c "import fps_auth_jupyterhub"

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/auth_jupyterhub
  summary: An FPS plugin for the authentication API, using JupyterHub.

extra:
  recipe-maintainers:
    - davidbrochart
